<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Describe a skill. Offshoot asks the right questions, refines the brief with parallel reviewers, and hands you a prompt Claude Code can build without asking." />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so dark users never see a white flash.
      (function () {
        try {
          var p = localStorage.getItem("offshoot:theme");
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0e11");
        } catch (e) {}
      })();
    </script>
    <meta property="og:title" content="Offshoot" />
    <meta property="og:description" content="Describe a skill. Get one prompt Claude Code can build from without asking anything." />
    <meta property="og:type" content="website" />
    <title>Offshoot ∗ Describe a skill, get the prompt</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%230a0a0a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>Offshoot needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
